services:
  # Backend Django avec SQLite
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: servicemenager_backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      # Images et fichiers statiques stockés directement sur le serveur (dossiers du projet)
      - ./backend/staticfiles:/app/staticfiles
      - ./backend/media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - servicemenager_network
    restart: unless-stopped

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: servicemenager_frontend
    ports:
      - "80:80"
      - "443:443"  # Port HTTPS
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro  # Certificats SSL (obligatoire pour que Nginx démarre avec nginx.conf HTTPS)
      - /var/www/certbot:/var/www/certbot:ro  # Pour les challenges Let's Encrypt
      - ./backend/media:/media:ro  # Servir /media/ directement par Nginx (logos, images) sans passer par le backend
    depends_on:
      - backend
    networks:
      - servicemenager_network
    restart: unless-stopped

networks:
  servicemenager_network:
    driver: bridge

