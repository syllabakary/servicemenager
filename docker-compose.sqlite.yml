services:
  # Backend Django avec SQLite
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: servicemenager_backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
      # La base SQLite est déjà persistée via ./backend:/app qui monte le répertoire local
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - servicemenager_network
    restart: unless-stopped

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: servicemenager_frontend
    ports:
      - "80:80"
      - "443:443"  # Port HTTPS
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro  # Certificats SSL
      - /var/www/certbot:/var/www/certbot:ro  # Pour les challenges Let's Encrypt
    depends_on:
      - backend
    networks:
      - servicemenager_network
    restart: unless-stopped

volumes:
  backend_static:
  backend_media:
  backend_db:

networks:
  servicemenager_network:
    driver: bridge

