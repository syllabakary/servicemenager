# Rate limiting : max 10 tentatives/minute sur l'endpoint de connexion
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

# Écoute HTTP uniquement (port 80) — pas de certificats dans le conteneur.
# Pour HTTPS : reverse proxy sur l'hôte (nginx/caddy) avec les certs Let's Encrypt.
server {
    listen 80;
    server_name ease-dom.fr ease-dom.net ease-dom.com 76.13.56.224 _;

    root /usr/share/nginx/html;
    index index.html;

    # Cacher la version nginx (M2)
    server_tokens off;

    # Headers de sécurité renforcés (M1)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none';" always;

    # Bloquer l'ancienne URL d'admin (sécurité : éviter la découverte)
    location = /admin/login {
        return 404;
    }

    # Bloquer les chemins d'admin courants ciblés par les bots
    location ~* ^/(wp-admin|wp-login|phpmyadmin|adminer|\.env|\.git) {
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    client_max_body_size 200M;
    client_body_buffer_size 512k;

    # Pour Let's Encrypt (si reverse proxy ou certbot sur l'hôte)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Servir /media/ depuis le volume monté (backend/media → /media dans le conteneur)
    location ^~ /media/ {
        root /;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
        try_files $uri =204;
    }

    # Rate limiting sur les endpoints de connexion (anti brute-force)
    location ~ ^/api/(token|login-matricule)/ {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        client_max_body_size 200M;
        proxy_request_buffering off;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    location ~* ^/(assets|images|img)/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Ne pas matcher /media/ (servi par le bloc ^~ /media/ ci‑dessus)
    location ~* ^(?!/media/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # robots.txt (L2)
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /admin/\nDisallow: /gestion-ease/\nDisallow: /api/\nAllow: /\n";
        add_header Content-Type text/plain;
    }

    # security.txt (L2)
    location = /.well-known/security.txt {
        return 200 "Contact: mailto:contact@ease-dom.fr\nPreferred-Languages: fr, en\n";
        add_header Content-Type text/plain;
    }
}
